name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # Keep emulator-backed suites separate so rules and server integration
      # failures are distinguishable from offline unit-test failures.
      - name: Firestore rules tests
        run: npm run test:rules

      - name: Server integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  evaluate:
    name: Deterministic prompt evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run evaluation gates
        run: npm run eval

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-evaluation-report
          path: evals/reports/latest.*

  e2e:
    name: E2E smoke test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase emulator runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start Firebase emulators
        run: npx firebase emulators:start --only auth,firestore,storage --project thinkfirst-huythedeev > "$RUNNER_TEMP/firebase-emulators.log" 2>&1 &

      - name: Wait for Firestore emulator
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8085/ > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/firebase-emulators.log"
          exit 1

      - name: Run Playwright smoke tests
        env:
          CI: true
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: true
          NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          NEXT_PUBLIC_FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          NEXT_PUBLIC_FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/firebase-emulators.log
